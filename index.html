<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Harbour Town · 微风港湾</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23294b42'/%3E%3Cpath d='M6 21h20l-4 6H10zM15 5h2v15h-2z' fill='%23f4eee1'/%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #3d4e60; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #f4eee1; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .heading { position: absolute; top: 30px; left: 34px; pointer-events: none; text-shadow: 0 2px 12px #15332e55; }
    h1 { margin: 0 0 8px; font: 600 30px Georgia, serif; letter-spacing: -.8px; }
    .heading p { margin: 0; font-size: 12px; letter-spacing: 2px; opacity: .8; }
    .toolbar { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 7px; padding: 8px; border-radius: 24px; background: #ece6d7df;
      box-shadow: 0 8px 30px #152c292a; backdrop-filter: blur(16px); white-space: nowrap; }
    button { cursor: pointer; border: 0; border-radius: 18px; padding: 10px 15px; color: #334851;
      background: transparent; font: inherit; font-size: 12px; transition: background .2s; }
    button:hover { background: #cbcfc4; }
    button.active { background: #3b525b; color: #f3edde; }
    .hint { position: absolute; left: 0; right: 0; bottom: 89px; text-align: center;
      font-size: 11px; pointer-events: none; opacity: .7; text-shadow: 0 1px 5px #173831; transition: opacity .6s; }
    .hint.dismissed { opacity: 0; }
    #status { position: absolute; inset: 0; display: grid; place-items: center; background: #405464e8; z-index: 3; }
    #status p { max-width: 500px; padding: 24px; text-align: center; line-height: 1.8; }
    #status.hidden { display: none; }
    @media (max-width: 600px) {
      .heading { top: 20px; left: 20px; } h1 { font-size: 25px; }
      .toolbar { gap: 0; bottom: 17px; } button { padding: 10px 11px; }
      .hint { bottom: 77px; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/build/three.module.js",
        "three/addons/": "./vendor/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header class="heading"><h1>Harbour Town</h1><p>微风港湾 · 一座会呼吸的小镇</p></header>
  <div id="status"><p id="status-text">正在搭建港湾…</p></div>
  <div class="hint">拖动旋转 · 滚轮缩放 · 右键平移</div>
  <nav class="toolbar" aria-label="场景控制">
    <button id="motion" class="active" aria-pressed="true">暂停动画</button>
    <button id="time" class="active" aria-pressed="true">日间</button>
    <button id="reset">重置视角</button>
    <button id="capture">保存图片</button>
    <button id="fullscreen">全屏</button>
  </nav>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
